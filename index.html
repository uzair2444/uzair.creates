        if (event && event.message && event.message.indexOf('Cannot set property fetch of #<Window>') !== -1) {

      }, true);

      try {
        var _currentFetch = window.fetch;
        var getFetch = function () {
          return _currentFetch;
        };
        var setFetch = function (val) {
          _currentFetch = val;
        };

        // 1. Define getter and setter on Window.prototype (where fetch getter is located in modern browsers)
        if (typeof Window !== 'undefined' && Window.prototype) {
          try {
            Object.defineProperty(Window.prototype, 'fetch', {
              get: getFetch,
              set: setFetch,
              configurable: true,
              enumerable: true
            });
          } catch (e1) { }
        }

        // 2. Define getter and setter on window object directly
        try {
          Object.defineProperty(window, 'fetch', {
            get: getFetch,
            set: setFetch,
            configurable: true,
            enumerable: true
          });
        } catch (e2) { }

        // 3. Walk prototype chain to catch any intermediate WindowProperties layers
        try {
          var proto = Object.getPrototypeOf(window);
          while (proto && proto !== Object.prototype) {
            var desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
            if (desc && (!desc.set || !desc.writable)) {
              Object.defineProperty(proto, 'fetch', {
                get: getFetch,
                set: setFetch,
                configurable: true,
                enumerable: true
              });
            }
            proto = Object.getPrototypeOf(proto);
          }
        } catch (e3) { }
      } catch (e) { }
    })();
