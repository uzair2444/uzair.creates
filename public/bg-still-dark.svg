<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Simple, Clean Studio Gradients (No filters, no clipping, zero invisible boxes) -->
    <linearGradient id="studioDarkBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C"/>
      <stop offset="40%" stop-color="#0E1118"/>
      <stop offset="75%" stop-color="#0C0E14"/>
      <stop offset="100%" stop-color="#07080B"/>
    </linearGradient>

    <!-- Gentle Center Studio Illumination (Muted slate for headings) -->
    <radialGradient id="studioCenterLight" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1C2230" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#121620" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#08090C" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Top-Right Ambient Warmth (Extremely subtle, clean warmth behind avatar) -->
    <radialGradient id="studioHeroWarmth" cx="82%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#281116" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#160B0F" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#08090C" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Bottom-Left Studio Depth -->
    <radialGradient id="studioBottomDepth" cx="18%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#151A24" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0B0D13" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Clean, Simple, Seamless Dark Background (No waves, no box artifacts) -->
  <rect width="1920" height="1080" fill="url(#studioDarkBase)"/>
  <rect width="1920" height="1080" fill="url(#studioCenterLight)"/>
  <rect width="1920" height="1080" fill="url(#studioHeroWarmth)"/>
  <rect width="1920" height="1080" fill="url(#studioBottomDepth)"/>
</svg>
