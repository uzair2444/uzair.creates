<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 1. Muted Porcelain Studio Base (Darker shade in white, zero glare, zero pink) -->
    <linearGradient id="darkshadeWhiteBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D5DAE3"/>
      <stop offset="35%" stop-color="#DDE2EC"/>
      <stop offset="65%" stop-color="#D0D6E0"/>
      <stop offset="100%" stop-color="#C8CFDA"/>
    </linearGradient>

    <!-- 2. Pure Specular White Light Ribbons for Glass Refraction -->
    <linearGradient id="specularRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="specularRibbon2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.70"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 3. Soft Depth Contours (Subtle cool slate-white tones) -->
    <linearGradient id="subtleContour" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#BAC2CF" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#CAD1DC" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#DDE2EB" stop-opacity="0"/>
    </linearGradient>

    <!-- 4. Soft Ambient Spotlights -->
    <radialGradient id="centerLight" cx="48%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#E2E7F0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D0D6E0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="spotTopRight" cx="82%" cy="22%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="spotBottomLeft" cx="15%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#BAC2CF" stop-opacity="0"/>
    </radialGradient>

    <!-- Pattern: Architectural Grid & Dot Matrix -->
    <pattern id="gridPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>

    <pattern id="dotPattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1A1A1A" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1920" height="1080" fill="url(#darkshadeWhiteBase)"/>

  <!-- Light Atmosphere Spots -->
  <rect width="1920" height="1080" fill="url(#centerLight)"/>
  <rect width="1920" height="1080" fill="url(#spotTopRight)"/>
  <rect width="1920" height="1080" fill="url(#spotBottomLeft)"/>

  <!-- Sculpted Elegant Flowing Glass Wave 1 -->
  <path d="M -150 220 C 350 90, 750 430, 1250 230 C 1650 70, 1850 330, 2100 210 L 2100 -100 L -150 -100 Z" fill="url(#subtleContour)"/>
  <path d="M -150 220 C 350 90, 750 430, 1250 230 C 1650 70, 1850 330, 2100 210" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.75"/>

  <!-- Sculpted Elegant Flowing Glass Wave 2 -->
  <path d="M -100 870 C 450 950, 850 650, 1350 770 C 1720 850, 1920 690, 2080 730 L 2080 1200 L -100 1200 Z" fill="url(#subtleContour)"/>
  <path d="M -100 870 C 450 950, 850 650, 1350 770 C 1720 850, 1920 690, 2080 730" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.65"/>

  <!-- Specular Light Flow Ribbon (Frosted Glass Illumination) -->
  <path d="M 180 -80 C 500 250, 850 580, 1200 800 C 1550 1020, 1800 1100, 2020 1200" fill="none" stroke="url(#specularRibbon1)" stroke-width="160" stroke-linecap="round"/>
  <path d="M -80 500 C 320 680, 750 820, 1180 880 C 1600 940, 1850 980, 2100 1000" fill="none" stroke="url(#specularRibbon2)" stroke-width="100" stroke-linecap="round"/>

  <!-- Architectural Subtle Orbit Rings (Pure Etched White & Soft Neutral) -->
  <g opacity="0.85">
    <circle cx="1550" cy="280" r="260" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.75"/>
    <circle cx="1550" cy="280" r="340" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="1550" cy="280" r="420" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-opacity="0.04" stroke-dasharray="6 6"/>

    <circle cx="280" cy="780" r="220" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.65"/>
    <circle cx="280" cy="780" r="300" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.35"/>
    <circle cx="280" cy="780" r="380" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-opacity="0.035" stroke-dasharray="4 6"/>
  </g>

  <!-- Architectural Subtle Grid & Texture Overlays -->
  <rect width="1920" height="1080" fill="url(#gridPattern)"/>
  <rect width="1920" height="1080" fill="url(#dotPattern)"/>
</svg>